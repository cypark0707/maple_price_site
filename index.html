<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>메이플 시세</title>
</head>
<body>

<h2>메이플 시세 (manifest 버전)</h2>

<button onclick="loadAll()">데이터 불러오기</button>

<table border="1" id="table"></table>

<script>

// =============================
// 1. 로그 파싱
// =============================
function parseLine(line) {
  const time = line.match(/^([\d\.\/:]+)/)?.[1] || "";
  const item = line.match(/\[(.*?)\]/)?.[1] || "";
  const count = line.match(/] (\d+)개/)?.[1] || "1";
  const price = line.match(/총합 ([\d,]+) 메소/)?.[1] || "0";

  return { time, item, count, price };
}

// =============================
// 2. manifest 읽기 → 파일 목록 자동 로드
// =============================
function loadAll() {
  fetch("manifest.json")
    .then(res => res.json())
    .then(files => {

      return Promise.all(
        files.map(f => fetch(f).then(r => r.text()))
      );

    })
    .then(allTexts => {

      const allLines = allTexts.join("\n").split("\n");

      const data = allLines
        .filter(l => l.includes("[") && l.includes("총합"))
        .map(parseLine);

      render(data);
    });
}

// =============================
// 3. 화면 출력
// =============================
function render(data) {
  const table = document.getElementById("table");

  table.innerHTML = `
    <tr>
      <th>시간</th>
      <th>아이템</th>
      <th>개수</th>
      <th>가격</th>
    </tr>
  `;

  data.forEach(d => {
    table.innerHTML += `
      <tr>
        <td>${d.time}</td>
        <td>${d.item}</td>
        <td>${d.count}</td>
        <td>${d.price}</td>
      </tr>
    `;
  });
}

</script>

</body>
</html>
